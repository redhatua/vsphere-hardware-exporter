version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      govmomi-and-prometheus:
        patterns:
          - "github.com/vmware/govmomi*"
          - "github.com/prometheus/*"
      go-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns:
          - "github.com/vmware/govmomi*"
          - "github.com/prometheus/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
