version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert
    - gosec
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
      - path: hack/
        linters: [gosec, revive]
formatters:
  enable:
    - gofmt
    - goimports
