# vmagent uses the Prometheus scrape config format.
# vmagent -promscrape.config=vmagent.yml -remoteWrite.url=http://victoria.example.com:8428/api/v1/write
scrape_configs:
  - job_name: vsphere-hardware
    scrape_interval: 5m
    scrape_timeout: 30s
    static_configs:
      - targets: ["vsphere-hardware-exporter:9877"]
